<!DOCTYPE html>
<html lang="en">
<head>
    <title>Security Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { border-bottom: 2px solid #30363d; padding-bottom: 15px; margin-bottom: 30px; }
        .back-link { color: #58a6ff; text-decoration: none; margin-right: 20px; }
        
        select {
            background-color: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 5px;
            border-radius: 4px;
        }

        .chart-box {
            background-color: #161b22;
            padding: 20px;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link"><- Back to Dashboard</a>
            <span style="font-size: 1.2em; font-weight: bold;">Live Alert Activity (Events per Minute)</span>
            <div style="float: right;">
                <label for="timeRange">Lookback Range: </label>
                <select id="timeRange" onchange="refreshChart()">
                    <option value="500">Last ~30 Minutes</option>
                    <option value="2000" selected>Last ~2 Hours</option>
                    <option value="5000">Last ~6 Hours</option>
                </select>
            </div>
        </header>

        <div class="chart-box">
            <canvas id="activityChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        async function refreshChart() {
            const rangeVal = document.getElementById('timeRange').value;
            // console.log("grabbing data for range:", rangeVal);
            
            try {
                const res = await fetch(`/metric_data?depth=${rangeVal}`);
                const chartData = await res.json();

                const ctx = document.getElementById('activityChart').getContext('2d');

                // clear old chart instance so it doesn't overlap
                if (myChart) {
                    myChart.destroy();
                }

                myChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: chartData.labels,
                        datasets: [{
                            label: 'Alert Count',
                            data: chartData.values,
                            backgroundColor: 'rgba(88, 166, 255, 0.6)',
                            borderColor: 'rgba(88, 166, 255, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: '#30363d' },
                                ticks: { color: '#c9d1d9' }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#c9d1d9', maxTicksLimit: 15 }
                            }
                        },
                        plugins: {
                            legend: { labels: { color: '#c9d1d9' } }
                        },
                        animation: false
                    }
                });
            } catch (err) {
                console.error("Chart load failed:", err);
            }
        }

        refreshChart();
        setInterval(refreshChart, 15000);
    </script>
</body>
</html>
